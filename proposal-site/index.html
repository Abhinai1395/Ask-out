<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be mine?</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #ff9a9e 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      color: #2d1b4e;
      overflow: hidden;
      position: relative;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
    }
    .heart:nth-child(1) { left: 8%; top: 15%; animation-delay: 0s; }
    .heart:nth-child(2) { left: 22%; top: 25%; animation-delay: 1.5s; }
    .heart:nth-child(3) { left: 48%; top: 8%; animation-delay: 3s; }
    .heart:nth-child(4) { left: 70%; top: 20%; animation-delay: 0.5s; }
    .heart:nth-child(5) { left: 88%; top: 12%; animation-delay: 2s; }
    .heart:nth-child(6) { left: 12%; top: 78%; animation-delay: 2.5s; }
    .heart:nth-child(7) { left: 82%; top: 82%; animation-delay: 1s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
      50% { transform: translateY(-20px) scale(1.1); opacity: 0.7; }
    }
    .card {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 800;
      margin-bottom: 2rem;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, #764ba2, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titlePulse 2s ease-in-out infinite;
    }
    @keyframes titlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .buttons {
      position: relative;
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      min-height: 140px;
      width: 100%;
      max-width: 320px;
    }
    .btn {
      padding: 0.85rem 1.75rem;
      font-size: 1.15rem;
      font-family: inherit;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-yes {
      background: linear-gradient(135deg, #f5576c, #f093fb);
      color: white;
      position: absolute;
      left: 75%;
      top: 50%;
      transform: translate(calc(-100% - 0.5rem), -50%);
      z-index: 1;
      box-shadow: 0 6px 24px rgba(245, 87, 108, 0.45);
    }
    .btn-yes:hover {
      transform: translate(calc(-100% - 0.5rem), -50%) scale(1.08);
      box-shadow: 0 8px 32px rgba(245, 87, 108, 0.55);
    }
    .btn-no {
      position: absolute;
      left: 75%;
      top: 50%;
      transform: translate(0.5rem, -50%);
      transition: left 0.15s ease-out, top 0.15s ease-out;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      color: #5a4a6a;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    .btn-no:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    .success {
      display: none;
      animation: fadeIn 0.5s ease;
    }
    .success.show {
      display: block;
    }
    .success h2 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, #f5576c, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .success p {
      font-size: 1.3rem;
      color: #5a4a6a;
      font-weight: 700;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
    <span class="heart">♥</span>
  </div>
  <div class="card" id="proposal">
    <h1>Wanna go out with me?</h1>
    <div class="buttons" id="buttonContainer">
      <button class="btn btn-yes" id="yesBtn">Yes</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>
  </div>
  <div class="card success" id="success">
    <h2>Yay!</h2>
    <p>You said yes. &lt;3</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const buttonContainer = document.getElementById('buttonContainer');
    const proposal = document.getElementById('proposal');
    const success = document.getElementById('success');
    const yesBtn = document.getElementById('yesBtn');

    function getRandomPosition() {
      const w = buttonContainer.offsetWidth;
      const h = buttonContainer.offsetHeight;
      const bw = noBtn.offsetWidth;
      const bh = noBtn.offsetHeight;
      const maxX = Math.max(0, w - bw - 16);
      const maxY = Math.max(0, h - bh - 16);
      const x = Math.random() * maxX + 8;
      const y = Math.random() * maxY + 8;
      return { x, y };
    }

    noBtn.addEventListener('mouseenter', function moveAway() {
      const pos = getRandomPosition();
      noBtn.style.left = pos.x + 'px';
      noBtn.style.top = pos.y + 'px';
      noBtn.style.transform = 'none';
    });

    noBtn.addEventListener('click', function(e) {
      e.preventDefault();
      const pos = getRandomPosition();
      noBtn.style.left = pos.x + 'px';
      noBtn.style.top = pos.y + 'px';
      noBtn.style.transform = 'none';
    });

    yesBtn.addEventListener('click', function() {
      proposal.style.display = 'none';
      success.classList.add('show');
    });
  </script>
</body>
</html>
