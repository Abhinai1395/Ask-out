<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Out?</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c, #ff9a9e);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      color: #2d1b4e;
      padding: 1rem;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Floating hearts */
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
    }

    .heart {
      position: absolute;
      font-size: 1.2rem;
      animation: float 7s ease-in-out infinite;
    }

    .heart:nth-child(1){ left:10%; top:20%; animation-delay:0s;}
    .heart:nth-child(2){ left:30%; top:10%; animation-delay:1.5s;}
    .heart:nth-child(3){ left:60%; top:15%; animation-delay:3s;}
    .heart:nth-child(4){ left:80%; top:30%; animation-delay:0.8s;}
    .heart:nth-child(5){ left:15%; top:75%; animation-delay:2.2s;}
    .heart:nth-child(6){ left:70%; top:80%; animation-delay:1.2s;}

    @keyframes float {
      0%,100% { transform: translateY(0); opacity:0.4; }
      50% { transform: translateY(-18px); opacity:0.7; }
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(255,255,255,0.9);
      border-radius: 22px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 800;
      margin-bottom: 1.8rem;
      background: linear-gradient(90deg, #764ba2, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1rem;
      color: #6b5c7a;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    /* Buttons */
    .buttons {
      position: relative;
      height: 140px;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
    }

    .btn {
      padding: 0.8rem 1.6rem;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
    }

    .btn-yes {
      background: linear-gradient(135deg, #f5576c, #f093fb);
      color: #fff;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-110%, -50%);
      box-shadow: 0 8px 26px rgba(245,87,108,0.45);
    }

    .btn-yes:hover {
      transform: translate(-110%, -50%) scale(1.08);
    }

    .btn-no {
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      color: #5a4a6a;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(10%, -50%);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      transition: left 0.15s ease, top 0.15s ease, transform 0.15s ease;
    }

    /* Success */
    .success {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .success h2 {
      font-size: 2.2rem;
      margin-bottom: 0.4rem;
      background: linear-gradient(90deg, #f5576c, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .success p {
      font-size: 1.1rem;
      color: #5a4a6a;
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity:0; transform: scale(0.9); }
      to { opacity:1; transform: scale(1); }
    }

    /* Mobile tweaks */
    @media (max-width: 400px) {
      .buttons { height: 160px; }
      .btn { font-size: 1rem; padding: 0.75rem 1.4rem; }
    }
  </style>
</head>

<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
  </div>

  <div class="card" id="proposal">
    <h1>Wanna go out with me?</h1>
    <div class="subtitle">No is an option ✨</div>

    <div class="buttons" id="buttonContainer">
      <button class="btn btn-yes" id="yesBtn">Yes 💖</button>
      <button class="btn btn-no" id="noBtn">No 🙃</button>
    </div>
  </div>

  <div class="card success" id="success">
    <h2>Yay! 🎉</h2>
    <p>Best decision you made in ur life 💕</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const container = document.getElementById('buttonContainer');
    const proposal = document.getElementById('proposal');
    const success = document.getElementById('success');
    const yesBtn = document.getElementById('yesBtn');

    let scale = 1;
    const minScale = 0.45;

    function moveNoButton() {
      const maxX = container.clientWidth - noBtn.offsetWidth;
      const maxY = container.clientHeight - noBtn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      scale = Math.max(minScale, scale * 0.92);

      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.transform = `scale(${scale})`;
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('touchstart', moveNoButton);
    noBtn.addEventListener('click', e => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener('click', () => {
      proposal.style.display = 'none';
      success.style.display = 'block';
    });
  </script>
</body>
</html>
